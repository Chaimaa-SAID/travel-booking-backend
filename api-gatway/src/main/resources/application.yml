spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: vol-service
          uri: lb://vol-service
          predicates:
            - Path=/api/flights/**

        - id: hotel-service
          uri: lb://hotel-service
          predicates:
            - Path=/api/hotels/**

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
