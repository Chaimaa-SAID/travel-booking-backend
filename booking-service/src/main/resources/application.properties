spring.application.name=booking-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/booking_db
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URLs des services
service.vol.url=http://localhost:8086
service.hotel.url=http://localhost:8082

# Optional: mock payment endpoint (local) - if you create a mock payment service on http://localhost:9000/pay
payment.service.url=http://localhost:8085

user-service.url=http://localhost:8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

jwt.secret=MySuperSecretJWTKey1234567890ABCDEF


